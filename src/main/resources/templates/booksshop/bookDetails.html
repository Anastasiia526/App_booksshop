<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title}">Book Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg p-4">
        <div class="row g-4">

            <div class="col-md-4 text-center">
                <img th:src="@{/images/{filename}(filename=${book.image})}"
                     class="img-fluid rounded"
                     style="max-height: 350px; object-fit: cover;"
                     alt="Book image"/>
            </div>

            <div class="col-md-8">

                <h2 th:text="${book.title}" class="mb-3">Book Title</h2>

                <p><strong>Product Code:</strong> <span th:text="${book.productCode}"></span></p>
                <p><strong>ISBN:</strong> <span th:text="${book.isbn}"></span></p>

                <p>
                    <strong>Brand:</strong>
                    <a th:href="@{/booksshop/brand/{brand}(brand=${book.brand})}"
                       class="link-primary"
                       th:text="${book.brand}"></a>
                </p>

                <p><strong>Authors:</strong></p>
                <ul class="list-inline">
                    <li class="list-inline-item" th:each="author : ${book.authors}">
                        <a th:href="@{/booksshop/author/{id}(id=${author.id})}"
                           class="badge bg-secondary text-decoration-none"
                           th:text="${author.fullName}"></a>
                    </li>
                </ul>

                <p><strong>Genres:</strong></p>
                <ul class="list-inline">
                    <li class="list-inline-item" th:each="genre : ${book.bookGenre}">
                        <a th:href="@{/booksshop/genre/{id}(id=${genre.id})}"
                           class="badge bg-info text-dark text-decoration-none"
                           th:text="${genre.name}"></a>
                    </li>
                </ul>

                <p><strong>Literary Genre:</strong></p>
                <ul class="list-inline">
                    <li class="list-inline-item" th:each="bookGenre : ${book.literaryGenre}">
                        <a th:href="@{/booksshop/literaryGenre/{id}(id=${bookGenre.id})}"
                           class="badge bg-warning text-dark text-decoration-none"
                           th:text="${bookGenre.name}"></a>
                    </li>
                </ul>

                <p><strong>Year:</strong> <span th:text="${book.yearOfPublication}"></span></p>
                <p><strong>Language:</strong> <span th:text="${book.language}"></span></p>

                <h4 class="mt-3 text-success">
                    <span th:text="${book.price}"></span> UAH
                </h4>

                <p class="mt-2">
                    <strong>Available:</strong>

                    <span th:if="${book.available}" class="badge bg-success me-2">
        In stock
    </span>

                    <a th:if="${book.available}"
                       th:href="@{/booksshop/available}"
                       class="btn btn-sm btn-outline-success me-2"
                       sec:authorize="hasRole('ADMIN')">
                        View Available
                    </a>

                    <!-- Книга не в наявності -->
                    <span th:if="${!book.available}" class="badge bg-danger me-2">
        Out of stock
    </span>

                    <a th:if="${!book.available}"
                       th:href="@{/booksshop/unavailable}"
                       class="btn btn-sm btn-outline-danger me-2"
                       sec:authorize="hasRole('ADMIN')">
                        View Unavailable
                    </a>

                    <!-- Кнопка редагування завжди поруч -->
                    <a th:href="@{/booksshop/{id}/edit(id=${book.id})}"
                       class="btn btn-sm btn-outline-primary"
                       sec:authorize="hasRole('ADMIN')">
                        Edit
                    </a>
                </p>

                <p><strong>Description:</strong></p>
                <p class="text-muted" th:text="${book.description}"></p>

                <form th:action="@{/orders/add-book}" method="post" th:if="${book.available}">
                    <input type="hidden" th:name="bookId" th:value="${book.id}"/>
                    <button type="submit" class="btn btn-primary mt-3">
                        🛒 Place an order
                    </button>
                </form>

                <form th:action="@{/booksshop/{id}(id=${book.id})}"
                      method="post"
                      sec:authorize="hasRole('ADMIN')"
                      class="mt-3">
                    <input type="hidden" name="method" value="delete"/>
                    <button type="submit" class="btn btn-danger">
                        Delete
                    </button>
                </form>

            </div>
        </div>
    </div>

    <div class="mt-4 d-flex justify-content-between">
        <button onclick="history.back()" class="btn btn-secondary">
            ← Return back
        </button>

        <a th:href="@{/booksshop}" class="btn btn-outline-primary">
            Back to Main Page
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
