<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">Create New Book</h2>

                <form method="POST"
                      th:action="@{/booksshop/book/new}"
                      th:object="${book}"
                      enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" th:field="*{title}" class="form-control"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Book Image</label>
                        <input type="file" name="file" class="form-control"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Product Code</label>
                        <input type="text" th:field="*{productCode}" class="form-control"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('productCode')}" th:errors="*{productCode}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ISBN</label>
                        <input type="text" th:field="*{isbn}" class="form-control"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Author</label>
                        <select th:field="*{authors}" class="form-select">
                            <option th:each="author : ${allAuthors}"
                                    th:value="${author.id}"
                                    th:text="${author.fullName}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Book Genres</label>
                        <select th:field="*{bookGenre}" class="form-select">
                            <option th:each="genre : ${allBookGenres}"
                                    th:value="${genre.id}"
                                    th:text="${genre.name}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Literary Genre</label>
                        <select th:field="*{literaryGenre}" class="form-select">
                            <option th:each="genre : ${allLiteraryGenres}"
                                    th:value="${genre.id}"
                                    th:text="${genre.name}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Brand</label>
                        <input type="text" th:field="*{brand}" class="form-control"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Year of Publication</label>
                        <input type="text" th:field="*{yearOfPublication}" class="form-control"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('yearOfPublication')}" th:errors="*{yearOfPublication}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Language</label>
                        <input type="text" th:field="*{language}" class="form-control"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('language')}" th:errors="*{language}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" th:field="*{price}" class="form-control"/>
                        <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" th:field="*{available}" class="form-check-input"/>
                        <label class="form-check-label">Available</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" class="btn btn-success">
                            ✔ Create
                        </button>

                        <a th:href="@{/booksshop}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
