<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-center">
        Search results
    </h2>

    <form th:action="@{/booksshop/search}" method="get" class="row g-2 justify-content-center mb-4">
        <div class="col-md-8">
            <label>
                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search by title, author, genre, brand, ISBN, language..."
                       th:value="${keyword}"/>
            </label>
        </div>

        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary">
                Search
            </button>
        </div>
    </form>

    <p class="text-center text-muted" th:if="${keyword != null && !keyword.isBlank()}">
        Results for:
        <strong th:text="${keyword}"></strong>
    </p>

    <div th:if="${books == null || books.isEmpty()}" class="alert alert-warning text-center">
        No books found.
    </div>

    <div class="row g-4" th:if="${books != null && !books.isEmpty()}">

        <div class="col-md-4" th:each="book : ${books}">
            <div class="card h-100 shadow-sm">

                <a th:href="@{/booksshop/{id}(id=${book.id})}"
                   class="text-decoration-none text-dark">

                    <img th:if="${book.image != null}"
                         th:src="@{/images/{filename}(filename=${book.image})}"
                         class="card-img-top"
                         style="height: 300px; object-fit: cover;"
                         alt="Book image"/>

                    <div class="card-body text-center">
                        <h5 class="card-title"
                            th:text="${book.title}">
                            Book Title
                        </h5>
                    </div>

                </a>

            </div>
        </div>

    </div>

    <div class="mt-5 text-center">
        <a th:href="@{/booksshop}" class="btn btn-outline-primary">
            Back to Main Page
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
