<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delivery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">Delivery Details</h2>

                <form th:method="POST"
                      th:action="@{/orders/delivery}"
                      th:object="${order}">

                    <h5 class="mb-3">Your books</h5>
                    <ul class="list-group mb-4">
                        <li class="list-group-item"
                            th:each="book : ${order.books}"
                            th:text="${book.title}">
                        </li>
                    </ul>

                    <h5 class="mb-3">Delivery information</h5>

                    <div class="mb-3">
                        <input type="text"
                               th:field="*{delivery.city}"
                               class="form-control"
                               placeholder="City"/>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('delivery.city')}"
                             th:errors="*{delivery.city}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               th:field="*{delivery.region}"
                               class="form-control"
                               placeholder="Region"/>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('delivery.region')}"
                             th:errors="*{delivery.region}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Delivery Method</label>
                        <label>
                            <select th:field="*{delivery.method}" class="form-select">
                                <option th:each="d : ${T(app.booksshop.org.example.entities.enums.DeliveryMethod).values()}"
                                        th:value="${d}"
                                        th:text="${d}">
                                </option>
                            </select>
                        </label>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('delivery.method')}"
                             th:errors="*{delivery.method}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label>
                            <input type="text"
                                   th:field="*{delivery.address}"
                                   class="form-control"
                                   placeholder="Address"/>
                        </label>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('delivery.address')}"
                             th:errors="*{delivery.address}">
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Next →
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
