<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Literary Genre List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Верхня панель -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Choose the Literary Genre</h2>

        <a th:href="@{/booksshop/book/new}"
           sec:authorize="hasRole('ADMIN')"
           class="btn btn-success">
            + Create new Book
        </a>
    </div>

    <!-- Список жанрів -->
    <div class="list-group shadow-sm">

        <div th:each="literaryGenre : ${literaryGenres}">
            <a th:href="@{/booksshop/literaryGenres/{id}(id=${literaryGenre.getId()})}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">

                <span th:text="${literaryGenre.getName()}">Genre Name</span>

                <span class="badge bg-primary rounded-pill">Open</span>
            </a>
        </div>

    </div>

    <!-- Кнопки -->
    <div class="mt-4 d-flex gap-3">

        <button onclick="history.back()" class="btn btn-secondary">
            ← Return back
        </button>

        <a th:href="@{/booksshop}" class="btn btn-outline-primary">
            Back to Main Page
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
