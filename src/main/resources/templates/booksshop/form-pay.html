<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">Payment Details</h2>

                <form th:method="POST"
                      th:action="@{/orders/pay}"
                      th:object="${order.pay}">

                    <h5 class="mb-3">Your books</h5>
                    <ul class="list-group mb-4">
                        <li class="list-group-item"
                            th:each="book : ${order.books}"
                            th:text="${book.title}">
                        </li>
                    </ul>


                    <h5 class="mb-3">Pay information</h5>
                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text"
                               th:field="*{cardNumber}"
                               class="form-control"
                               placeholder="1234 5678 9012 3456"/>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('cardNumber')}"
                             th:errors="*{cardNumber}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Expiration Date</label>
                            <input type="text"
                                   th:field="*{expirationDate}"
                                   class="form-control"
                                   placeholder="MM/YY"/>
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('expirationDate')}"
                                 th:errors="*{expirationDate}">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">CVV</label>
                            <input type="text"
                                   th:field="*{cvv}"
                                   class="form-control"
                                   placeholder="123"/>
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('cvv')}"
                                 th:errors="*{cvv}">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-success btn-lg">
                            💳 Pay Now
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
