<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">Place your order</h2>

                <form th:method="POST"
                      th:action="@{/orders/customer}"
                      th:object="${order}">

                    <!-- Books -->
                    <h5 class="mb-3">Your books</h5>
                    <ul class="list-group mb-4">
                        <li class="list-group-item"
                            th:each="book : ${order.books}"
                            th:text="${book.title}">
                        </li>
                    </ul>

                    <h5 class="mb-3">Customer information</h5>

                    <!-- First Name -->
                    <div class="mb-3">
                        <input type="text"
                               th:field="*{customer.firstName}"
                               class="form-control"
                               placeholder="First Name"/>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('customer.firstName')}"
                             th:errors="*{customer.firstName}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               th:field="*{customer.lastName}"
                               class="form-control"
                               placeholder="Last Name"/>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('customer.lastName')}"
                             th:errors="*{customer.lastName}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <input type="email"
                               th:field="*{customer.email}"
                               class="form-control"
                               placeholder="Email"/>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('customer.email')}"
                             th:errors="*{customer.email}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               th:field="*{customer.phoneNumber}"
                               class="form-control"
                               placeholder="Phone number"/>
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('customer.phoneNumber')}"
                             th:errors="*{customer.phoneNumber}">
                        </div>
                    </div>

                    <!-- Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Next →
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
