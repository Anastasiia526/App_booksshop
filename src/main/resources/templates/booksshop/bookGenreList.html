<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List Book Genres</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-center">Choose the genre of book</h2>

    <!-- Список жанрів -->
    <div class="list-group shadow-sm">

        <div th:each="genre : ${bookGenre}">
            <a th:href="@{/booksshop/genre/{id}/book(id=${genre.id})}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">

                <span th:text="${genre.name}">Genre Name</span>

                <span class="badge bg-primary rounded-pill">View</span>
            </a>
        </div>

    </div>

    <!-- Кнопки -->
    <div class="mt-4 d-flex justify-content-between">

        <button onclick="history.back()" class="btn btn-secondary">
            ← Return back
        </button>

        <a th:href="@{/booksshop}" class="btn btn-outline-primary">
            Back to Main Page
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
